<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Product Listing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-4" style="max-width: 760px;">
  <h1 class="h3 mb-4">Grocery Product Listing</h1>

  <!-- Task 1 & 2: all products -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 mb-0">All products <span class="badge text-bg-secondary" id="count"></span></h2>
        <button class="btn btn-success btn-sm" id="addBtn">Add Watermelon (80)</button>
      </div>
      <ul class="list-group" id="allProducts"></ul>
    </div>
  </div>

  <!-- Task 3: price greater than 50 -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="h6 mb-3">Products with price greater than 50</h2>
      <ul class="list-group" id="expensiveProducts"></ul>
    </div>
  </div>
</main>

<script>
  const products = ["Apple", "Banana", "Mango", "Grapes", "Orange"];
  const prices   = [50, 30, 120, 90, 45];

  // Task 1: merge names and prices into one array
  function mergeItems() {
    return products.map((name, i) => `Product: ${name} - Price: ${prices[i]}`);
  }

  // Task 2: display all entries using a loop
  function showAll() {
    const items = mergeItems();
    const list = document.getElementById("allProducts");
    list.innerHTML = "";

    for (let i = 0; i < items.length; i++) {
      const li = document.createElement("li");
      li.className = "list-group-item";
      li.textContent = items[i];
      list.appendChild(li);
    }

    document.getElementById("count").textContent = items.length;
  }

  // Task 3: show only products with price greater than 50
  function showExpensive() {
    const list = document.getElementById("expensiveProducts");
    list.innerHTML = "";

    products.forEach((name, i) => {
      if (prices[i] > 50) {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between";
        li.innerHTML = `<span></span><span class="badge text-bg-warning"></span>`;
        li.children[0].textContent = name;
        li.children[1].textContent = prices[i];
        list.appendChild(li);
      }
    });
  }

  // Task 4: add Watermelon (80) and display the updated list
  let added = false;
  document.getElementById("addBtn").addEventListener("click", function () {
    if (added) return;            // prevent adding it twice
    products.push("Watermelon");
    prices.push(80);
    added = true;
    this.disabled = true;
    this.textContent = "Watermelon added";
    showAll();
    showExpensive();
  });

  // Show the initial lists when the page loads
  showAll();
  showExpensive();
</script>
</body>
</html>
