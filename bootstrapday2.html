<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profile and Grades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .profile-image {
      width: 150px;
      height: 150px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container my-5">

    
    <h1 class="display-4 text-center">Student Profile</h1>

    
    <blockquote class="blockquote text-center">
      <p>"Learning never exhausts the mind."</p>
    </blockquote>

    
    <img class="profile-image rounded-circle d-block mx-auto my-4"
         src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNupSKjnCIs8Z8mbmI3Nm1Huhj_wEEm-BQo522KiZjAg&s=10"
         alt="Student profile picture">

    
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Subject</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Mathematics</td>
          <td>92</td>
        </tr>
        <tr>
          <td>Science</td>
          <td>88</td>
        </tr>
        <tr>
          <td>English</td>
          <td>85</td>
        </tr>
      </tbody>
    </table>

    
    <div class="alert alert-success" role="alert">
      Profile updated successfully!
    </div>

  </div>

</body>
</html>
