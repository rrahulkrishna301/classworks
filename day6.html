
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid gray;
            text-align: center;
            margin: 20px auto;
            background-color: white;
        }

        
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid black;
            border-radius: 20px 0 20px 0;
        }

        
        .card h2 {
            font-size: 24px;
        }

    
        .card button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        
        @media screen and (max-width: 600px) {
            .card {
                width: 80%;
                text-align: center;
            }

            .card h2 {
                font-size: 18px;
            }

            .card button {
                font-size: 14px;
            }
        }

        @media screen and (orientation: landscape) {
            .card {
                background-color: lightblue;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <img
            src="https://placehold.co/300x200?text=Product+Image"
            alt="Product Image"
            class="product-img"
        >

        <h2>Smart Watch</h2>

        <button>Buy Now</button>
    </div>

</body>
</html>
