<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return an item</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 460px;">
  <section class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-1">Return an item</h1>
      <p class="text-body-secondary mb-4">Items can be returned within 7 days of delivery.</p>

      <form id="returnForm" novalidate>
        <div class="mb-3">
          <label for="itemName" class="form-label">Item name</label>
          <input type="text" id="itemName" class="form-control" placeholder="e.g. Wireless Headphones" required>
        </div>

        <div class="mb-3">
          <label for="isDelivered" class="form-label">Delivery status</label>
          <select id="isDelivered" class="form-select">
            <option value="true">Delivered</option>
            <option value="false">Not delivered</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="days" class="form-label">Days since delivery</label>
          <input type="number" id="days" class="form-control" min="0" step="1" placeholder="e.g. 5" required>
        </div>

        <button id="returnBtn" type="button" class="btn btn-primary w-100">
          Check return eligibility
        </button>
      </form>

      <div id="result" class="alert d-none mt-3 mb-0" role="status">
        <div id="message" class="fw-semibold"></div>
        <small id="details"></small>
      </div>
    </div>
  </section>
</main>

<script>
document.getElementById("returnBtn").addEventListener("click", () => {
  const form = document.getElementById("returnForm");

  // Stop here and show the browser's messages if a field is empty or invalid
  form.reportValidity() && checkReturn();
});

function checkReturn() {
  // Build the order object from the values entered on the page
  const order = {
    itemName: document.getElementById("itemName").value.trim(),
    isDelivered: document.getElementById("isDelivered").value === "true",
    daysSinceDelivery: Number(document.getElementById("days").value)
  };

  // Not delivered -> "not yet delivered"; delivered within 7 days -> eligible; else expired
  const message = !order.isDelivered
    ? "Item not yet delivered"
    : order.daysSinceDelivery <= 7
      ? "Eligible for Return"
      : "Return Period Expired";

  const style = !order.isDelivered
    ? "alert-warning"
    : order.daysSinceDelivery <= 7
      ? "alert-success"
      : "alert-danger";

  // Check that itemName exists in the object
  const hasName = "itemName" in order;

  // Remove daysSinceDelivery
  delete order.daysSinceDelivery;

  document.getElementById("result").className = "alert mt-3 mb-0 " + style;
  document.getElementById("message").textContent = message;
  document.getElementById("details").textContent =
    "itemName exists: " + hasName + " | Order after delete: " + JSON.stringify(order);
}
</script>
</body>
</html>
